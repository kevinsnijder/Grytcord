services:
  bot:
    build:
      context: .
      dockerfile: "./Dockerfile"
      tags:
        - "grytcord:latest"
    volumes:
      # The Gryt identity key lives here. THE FILE IS THE BOT: lose this volume
      # and the server sees a stranger knocking, holding none of the bot's
      # permissions, name or history.
      - "./data:/data"
      - "./config.js:/app/config.js"
      # Author pictures are written to /data/avatars and have to be reachable
      # from the internet, or bridged messages show a blank face — Discord will
      # not fetch one from the Gryt server. Mount a folder your web server
      # already publishes over it, and set PublicBaseUrl to match. See the
      # README, "Author pictures".
      # - "/var/www/example.com/files/gryt/avatars:/data/avatars"
    restart: on-failure
    # ports:
    #   - "8080:8080" # /health, and /avatars if you serve pictures from here
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - grytcord-net

networks:
  grytcord-net:
    driver: bridge
    name: grytcord-net
